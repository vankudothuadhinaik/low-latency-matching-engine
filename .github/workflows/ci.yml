name: C++20 CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Smoke test cancellation-heavy benchmark
        run: ./build/engine_benchmark 20000 1 100 cancellation-heavy
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure with AddressSanitizer and UndefinedBehaviorSanitizer
        run: >-
          cmake -S . -B build-sanitizers
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTS=ON
          -DBUILD_BENCHMARKS=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-sanitizers --parallel 2
      - name: Test
        run: ctest --test-dir build-sanitizers --output-on-failure

  benchmark-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Record runner and compiler metadata
        run: |
          {
            echo "Commit: $(git rev-parse HEAD)"
            echo "OS: $(uname -a)"
            echo "Compiler:"
            g++ --version
            echo "CPU:"
            lscpu
            echo "Build type: Release"
            echo "Command: engine_benchmark 200000 3 100 <workload>"
          } > benchmark-results.txt
      - name: Build release benchmark
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=ON
          cmake --build build --target engine_benchmark --parallel 2
      - name: Run reproducible workload suite
        run: |
          set -o pipefail
          for workload in mixed marketable non-crossing skewed-price cancellation-heavy; do
            echo "" | tee -a benchmark-results.txt
            echo "===== workload: ${workload} =====" | tee -a benchmark-results.txt
            ./build/engine_benchmark 200000 3 100 "${workload}" 2>&1 | tee -a benchmark-results.txt
          done
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: matching-engine-benchmark-${{ github.sha }}
          path: benchmark-results.txt
          if-no-files-found: error
          retention-days: 30
